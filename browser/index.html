<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser • Toolkit</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --border: #2a2e39;
      --text: #e1e4e8;
      --text-dim: #8b949e;
      --accent: #238636;
      --accent-hover: #2ea043;
      --danger: #da3633;
      --warn: #d29922;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }
    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h1 { font-size: 16px; font-weight: 600; color: var(--text); }
    a.back { color: var(--text-dim); text-decoration: none; font-size: 14px; }
    a.back:hover { color: var(--text); }
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: #21262d; border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { background: #30363d; }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .lamp {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
    }
    .lamp.ok { background: var(--accent); box-shadow: 0 0 8px rgba(35, 134, 54, 0.6); }
    .lamp.busy { background: var(--warn); box-shadow: 0 0 8px rgba(210, 153, 34, 0.6); }
    .lamp.bad { background: var(--danger); box-shadow: 0 0 8px rgba(218, 54, 51, 0.6); }
    
    .workspace {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .overlay h2 { font-size: 20px; font-weight: 500; }
    .overlay p { color: var(--text-dim); font-size: 14px; max-width: 400px; text-align: center; }
  </style>
</head>
<body>

  <header>
    <div class="nav-left">
      <a href="../" class="back">← Toolkit</a>
      <span style="color: var(--border);">/</span>
      <h1>Remote Browser</h1>
    </div>
    <div class="nav-right">
      <div class="status-indicator">
        <div id="lamp" class="lamp"></div>
        <span id="statusText">Disconnected</span>
      </div>
      <button id="btnConnect" class="btn">Connect Session</button>
      <button id="btnReload" class="btn btn-secondary" disabled>Reload</button>
      <button id="btnFullscreen" class="btn btn-secondary" disabled>Fullscreen</button>
    </div>
  </header>

  <div class="workspace">
    <div id="ovIdle" class="overlay">
      <h2>Cloud Virtual Browser</h2>
      <p>Click "Connect Session" below to initialize a secure isolated browser instance running Google.</p>
      <button id="btnConnectCenter" class="btn" style="padding: 10px 20px; font-size: 14px;">Start Session</button>
    </div>
    <iframe id="frame" allow="clipboard-read; clipboard-write; microphone; camera"></iframe>
  </div>

  <script>
    (() => {
      const WORKER_URL = "https://divine-water-1feb.bouziane-ahs.workers.dev";
      const frame = document.getElementById("frame");
      const btnConnect = document.getElementById("btnConnect");
      const btnConnectCenter = document.getElementById("btnConnectCenter");
      const btnReload = document.getElementById("btnReload");
      const btnFullscreen = document.getElementById("btnFullscreen");
      const statusText = document.getElementById("statusText");
      const lamp = document.getElementById("lamp");
      const ovIdle = document.getElementById("ovIdle");

      function setStatus(kind, text) {
        lamp.className = "lamp " + (kind || "");
        statusText.textContent = text;
      }

      async function connectSession() {
        setStatus("busy", "Spawning VM instance…");
        btnConnect.disabled = true;
        if(btnConnectCenter) btnConnectCenter.disabled = true;

        try {
          const res = await fetch(WORKER_URL);
          const data = await res.json();

          if (!res.ok || !data.embed_url) {
            throw new Error(data.error || "Failed to establish remote browser stream");
          }

          frame.src = data.embed_url;
          
          frame.onload = () => {
            ovIdle.classList.add("hidden");
            setStatus("ok", "Active");
            btnConnect.disabled = false;
            btnConnect.textContent = "Reconnect";
            btnReload.disabled = false;
            btnFullscreen.disabled = false;
            if(btnConnectCenter) btnConnectCenter.disabled = false;
          };

        } catch (err) {
          setStatus("bad", "Connection failed");
          btnConnect.disabled = false;
          if(btnConnectCenter) btnConnectCenter.disabled = false;
          alert(err.message);
        }
      }

      btnConnect.addEventListener("click", connectSession);
      if(btnConnectCenter) btnConnectCenter.addEventListener("click", connectSession);

      btnReload.addEventListener("click", () => {
        if (frame.src) frame.contentWindow.location.reload();
      });

      btnFullscreen.addEventListener("click", () => {
        if (frame.requestFullscreen) {
          frame.requestFullscreen();
        }
      });
    })();
  </script>
</body>
</html>
