<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Browser · Toolkit</title>
<style>
  :root {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --border: #334155;
    --ok: #10b981;
    --warn: #f59e0b;
    --err: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: .5rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: .75rem; }
  .btn-back { color: var(--text-muted); text-decoration: none; font-size: 1.25rem; }
  .btn-back:hover { color: var(--text); }
  h1 { font-size: 1.1rem; font-weight: 600; }
  .controls { display: flex; gap: .5rem; align-items: center; }
  button {
    background: var(--border);
    color: var(--text);
    border: none;
    padding: .4rem .75rem;
    border-radius: .375rem;
    cursor: pointer;
    font-size: .875rem;
    font-weight: 500;
  }
  button:hover { background: #475569; }
  button.primary { background: var(--primary); }
  button.primary:hover { background: var(--primary-hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #status { font-size: .85rem; padding: .2rem .5rem; border-radius: .25rem; background: #020617; color: var(--ok); }
  #status.loading { color: var(--warn); }
  #status.error { color: var(--err); }
  main { flex: 1; position: relative; width: 100%; height: 100%; }
  iframe { width: 100%; height: 100%; border: none; background: #000; }
  .overlay {
    position: absolute; inset: 0;
    background: rgba(15,23,42,.95);
    display: flex; align-items: center; justify-content: center;
    z-index: 5;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 2rem;
    border-radius: .75rem;
    max-width: 450px; width: 90%;
    text-align: center;
  }
  .card h2 { margin-bottom: .75rem; font-size: 1.25rem; }
  .card h2.err { color: var(--err); }
  .card p { color: var(--text-muted); font-size: .95rem; margin-bottom: 1.5rem; line-height: 1.5; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <a href="../" class="btn-back" aria-label="Back to Toolkit">←</a>
    <h1>Remote Browser</h1>
    <span id="status">Not connected</span>
  </div>
  <div class="controls">
    <button id="btnConnect" class="primary">Connect</button>
    <button id="btnReload" disabled>Reload</button>
  </div>
</header>

<main>
  <iframe id="frame" class="hidden" title="Remote browser"
          allow="clipboard-read; clipboard-write; fullscreen; autoplay"></iframe>

  <div id="ovStart" class="overlay">
    <div class="card">
      <h2>Start a remote browser</h2>
      <p>Connects automatically. If it doesn't, select Connect.</p>
    </div>
  </div>

  <div id="ovError" class="overlay hidden">
    <div class="card">
      <h2 class="err">Could not start session</h2>
      <p id="errorText"></p>
      <button id="btnRetry" class="primary">Try again</button>
    </div>
  </div>
</main>

<script>
(() => {
  const statusEl = document.getElementById("status");
  const frame = document.getElementById("frame");
  const ovStart = document.getElementById("ovStart");
  const ovError = document.getElementById("ovError");
  const errorText = document.getElementById("errorText");
  const btnConnect = document.getElementById("btnConnect");
  const btnReload = document.getElementById("btnReload");

  let sessionId = "";

  function setStatus(kind, text) {
    statusEl.textContent = text;
    statusEl.className = kind || "";
  }

  function endSession() {
    if (!sessionId) return;
    const blob = new Blob([JSON.stringify({ session_id: sessionId })], { type: "application/json" });
    try { navigator.sendBeacon("/session/end", blob); } catch {}
    sessionId = "";
  }

  async function connect() {
    endSession();
    setStatus("loading", "Connecting…");
    ovStart.classList.add("hidden");
    ovError.classList.add("hidden");
    btnConnect.disabled = true;
    btnReload.disabled = true;

    try {
      // Same-origin call: no external domain involved from the browser's side.
      const r = await fetch("/session", { method: "POST", cache: "no-store" });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || `Server returned ${r.status}`);
      if (!data.embed_url) throw new Error("No session address returned");

      sessionId = data.session_id || "";
      frame.src = data.embed_url;
      frame.classList.remove("hidden");
      setStatus("", "Connected");
      btnReload.disabled = false;
      btnConnect.textContent = "New session";
    } catch (err) {
      setStatus("error", "Error");
      frame.classList.add("hidden");
      errorText.textContent = err.message || "Could not reach the session service.";
      ovError.classList.remove("hidden");
    } finally {
      btnConnect.disabled = false;
    }
  }

  btnConnect.addEventListener("click", connect);
  document.getElementById("btnRetry").addEventListener("click", connect);
  btnReload.addEventListener("click", () => {
    if (!frame.classList.contains("hidden")) {
      const src = frame.src;
      frame.src = "";
      frame.src = src;
    } else {
      connect();
    }
  });
  window.addEventListener("pagehide", endSession);

  // Auto-connect on load.
  if (document.readyState === "complete") connect();
  else window.addEventListener("load", connect, { once: true });
})();
</script>
</body>
</html>
