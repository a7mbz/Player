<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> YouTube premium </title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        input { width: 70%; padding: 10px; border-radius: 5px; border: none; font-size: 16px; }
        button { padding: 10px 20px; border-radius: 5px; border: none; background-color: #ff0000; color: #fff; font-size: 16px; cursor: pointer; }
        .video-container { margin-top: 20px; position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Premuim Player</h2>
        <input type="text" id="ytUrl" placeholder="Video link here ...">
        <button onclick="playVideo()">Play</button>
        <div class="video-container" id="player"></div>
    </div>

    <!------------------ Adblock YTB script ------------------>
    <script>
        (function() {
            'use strict';
            (function() {
    'use strict';

    // Core logic to find and bypass ads
    function bypassYouTubeAds() {
        const video = document.querySelector('video');
        const skipButton = document.querySelector('.ytp-skip-ad-button, .ytp-ad-skip-button, .ytp-ad-skip-button-modern');
        const adOverlay = document.querySelector('.ytp-ad-player-overlay, .ytp-ad-overlay-container');

        // 1. If an explicit "Skip" button exists, click it instantly
        if (skipButton) {
            skipButton.click();
            console.log('[AdBlock] Skipped ad via button.');
        }

        // 2. If an ad is playing but unskippable, fast-forward it
        if (adOverlay && video) {
            // Speed up the video to 16x (maximum allowed by Chrome/Firefox engines)
            video.playbackRate = 16;
            video.muted = true; // Mute the ad audio
            console.log('[AdBlock] Speeding up unskippable ad.');
        }
    }

    // Monitor the DOM for changes so we don't rely on laggy intervals
    const observer = new MutationObserver(() => {
        bypassYouTubeAds();
    });

    // Start watching the YouTube player container
    const targetNode = document.body;
    if (targetNode) {
        observer.observe(targetNode, {
            childList: true,
            subtree: true
        });
    }
})();

        })();
    </script>
    <!------------------ Adblock YTB script ------------------>

    
    <script>
        function playVideo() {
            let input = document.getElementById('ytUrl').value;
            let videoId = '';
            
            // استخراج ID الفيديو من الرابط
            if (input.includes('v=')) {
                videoId = input.split('v=')[1].split('&')[0];
            } else if (input.includes('youtu.be/')) {
                videoId = input.split('youtu.be/')[1].split('?')[0];
            } else {
                videoId = input; // إذا دخل الـ ID مباشرة
            }

            if (videoId) {
                // استخدام youtube-nocookie لزيادة نسبة تخطي الحظر
                document.getElementById('player').innerHTML = 
                    `<iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1" allowfullscreen></iframe>`;
            } else {
                alert('الرابط غير صحيح!');
            }
        }
    </script>
</body>
</html>
