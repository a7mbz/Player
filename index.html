<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Personal Toolkit </title>
    <link rel="icon" type="image/png" href="favicon.png">
    
      <!-- Direct CSS implementation starts here -->
    
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        input { width: 70%; padding: 10px; border-radius: 5px; border: none; font-size: 16px; }
        button { padding: 10px 20px; border-radius: 5px; border: none; background-color: #ff0000; color: #fff; font-size: 16px; cursor: pointer; }
        .video-container { margin-top: 20px; position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    
      /* Reset standard margins and paddings */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
    }

    /* Header Container */
    .site-header {
      display: flex;
      justify-content: space-between; /* Pushes logo left, nav right */
      align-items: center;            /* Centers items vertically */
      padding: 20px 10%;              /* Adds breathing room to sides */
      background-color: #2c3e50;      /* Dark sleek background color */
      position: sticky;               /* Keeps navbar on top while scrolling */
      top: 0;
      z-index: 1000;
    }

    /* Logo Styling */
    .logo a {
      font-size: 24px;
      font-weight: bold;
      color: #ffffff;
      text-decoration: none;
    }

    /* Unordered List Layout */
    .nav-links {
      display: flex;
      list-style: none;               /* Removes generic bullet points */
    }

    /* Individual Links spacing */
    .nav-links li {
      padding: 0px 20px;
    }

    /* Link Styling and Hover Effect */
    .nav-links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #1abc9c;                 /* Changes color on hover */
    }
  </style>
  <!-- Direct CSS implementation ends here -->
</head>
<body>

  <header class="site-header">
    <div class="logo">
      <a href="#">MyWebsite</a>
    </div>
    <nav class="navbar">
      <ul class="nav-links">
        <li><a href="#Link">Home</a></li>
        <li><a href="#Link">Soon</a></li>
        <li><a href="#Link">Soon</a></li>
        <li><a href="#Link">Soon</a></li>
      </ul>
    </nav>
  </header>
  
    <br>
    <br>
    
    <div class="container">
        <h2>YT Player</h2>
        <input type="text" id="ytUrl" placeholder="Video link here ...">
        <button onclick="playVideo()">Play</button>
        <div class="video-container" id="player"></div>
    </div>

    <script>
        function playVideo() {
            let input = document.getElementById('ytUrl').value;
            let videoId = '';
            
            // استخراج ID الفيديو من الرابط
            if (input.includes('v=')) {
                videoId = input.split('v=')[1].split('&')[0];
            } else if (input.includes('youtu.be/')) {
                videoId = input.split('youtu.be/')[1].split('?')[0];
            } else {
                videoId = input; // إذا دخل الـ ID مباشرة
            }

            if (videoId) {
                // استخدام youtube-nocookie لزيادة نسبة تخطي الحظر
                document.getElementById('player').innerHTML = 
                    `<iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1" allowfullscreen></iframe>`;
            } else {
                alert('الرابط غير صحيح!');
            }
        }
    </script>
</body>
</html>
