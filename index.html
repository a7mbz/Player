<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Premium Player (Agent Edition)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; text-align: center; background: #121212; color: #e0e0e0; }
        input { width: 80%; padding: 12px; font-size: 16px; margin: 10px 0; border: 1px solid #333; border-radius: 6px; background: #1e1e1e; color: #fff; }
        button { padding: 12px 24px; font-size: 16px; background: #ff0000; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #cc0000; }
        .video-container { position: relative; padding-bottom: 56.25%; padding-top: 30px; height: 0; overflow: hidden; margin-top: 30px; display: none; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

    <h1>Premium Player</h1>
    <p>Watch YouTube videos without cookies, tracking profiles, or intrusive sidebar traps:</p>
    
    <input type="text" id="videoInput" placeholder="Paste standard YouTube link, Shorts, or 11-digit ID...">
    <br>
    <button onclick="loadVideoFromInput()">Play</button>

    <div class="video-container" id="playerContainer">
        <iframe id="videoPlayer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <script>
        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match.length === 11) ? match : null;
        }

        function embedVideo(id) {
            if (!id) return;
            const player = document.getElementById('videoPlayer');
            const container = document.getElementById('playerContainer');
            player.src = `https://youtube-nocookie.com{id}?rel=0&autoplay=1`;
            container.style.display = 'block';
        }

        function loadVideoFromInput() {
            const inputVal = document.getElementById('videoInput').value.trim();
            const videoId = inputVal.length === 11 ? inputVal : extractVideoID(inputVal);
            
            if (videoId) {
                embedVideo(videoId);
                window.history.pushState({}, '', `?yt=${videoId}`);
            } else {
                alert('Invalid URL or Video ID. Please check your link.');
            }
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const ytParam = urlParams.get('yt');
            if (ytParam) {
                embedVideo(ytParam);
                document.getElementById('videoInput').value = ytParam;
            }
        }
    </script>
</body>
</html>
