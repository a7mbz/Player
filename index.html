<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Video Portal</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        
        /* Search Bar Styles */
        .search-box { display: flex; gap: 10px; width: 100%; }
        .search-box input { flex: 1; padding: 12px; border: none; border-radius: 4px; font-size: 16px; }
        .search-box button { padding: 12px 24px; background: #ff0000; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        
        /* Video Player Wrapper (keeps standard 16:9 aspect ratio) */
        .player-wrapper { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 8px; overflow: hidden; display: none; }
        .player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        /* Grid Layout for Results */
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .video-card { background: #1e1e1e; border-radius: 6px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .video-card:hover { transform: scale(1.03); }
        .video-card img { width: 100%; display: block; }
        .video-card .title { padding: 10px; font-size: 14px; font-weight: bold; line-height: 1.2; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. Search Interface -->
    <div class="search-box">
        <input type="text" id="query" placeholder="Search YouTube videos...">
        <button onclick="searchYouTube()">Search</button>
    </div>

    <!-- 2. Inline Player Anchor -->
    <div class="player-wrapper" id="playerContainer">
        <div id="player"></div>
    </div>

    <!-- 3. Dynamic Search Results -->
    <div class="results-grid" id="results"></div>
</div>

<!-- Load the asynchronous YouTube Player API framework -->
<script src="https://youtube.com"></script>

<script>
    // Replace with your generated API key from Google Cloud Console
    const API_KEY = 'YOUR_YOUTUBE_DATA_API_KEY'; 
    
    let player;
    let videoQueue = [];
    let currentVideoIndex = 0;

    // Initialize the YouTube Player object when the API finishes downloading
    function onYouTubeIframeAPIReady() {
        // Player placeholder initialized empty; will load dynamically on card click
    }

    // Pull video data directly from YouTube API endpoint
    async function searchYouTube() {
        const query = document.getElementById('query').value;
        if (!query) return;

        const url = `https://googleapis.com{encodeURIComponent(query)}&type=video&key=${API_KEY}`;
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            
            // Map JSON response to a clean working array of video objects
            videoQueue = data.items.map(item => ({
                id: item.id.videoId,
                title: item.snippet.title,
                thumb: item.snippet.thumbnails.medium.url
            }));
            
            renderResults();
        } catch (error) {
            console.error("Error fetching live YouTube data:", error);
        }
    }

    // Render results grid inside the webpage
    function renderResults() {
        const container = document.getElementById('results');
        container.innerHTML = '';
        
        videoQueue.forEach((video, index) => {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.onclick = () => playVideo(index);
            
            card.innerHTML = `
                <img src="${video.thumb}" alt="thumbnail">
                <div class="title">${video.title}</div>
            `;
            container.appendChild(card);
        });
    }

    // Instantiates or updates player state to play video inline without reloading
    function playVideo(index) {
        currentVideoIndex = index;
        const videoId = videoQueue[index].id;
        
        document.getElementById('playerContainer').style.display = 'block';

        if (!player) {
            // First time loading a video: create the player instance
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: { 'autoplay': 1, 'playsinline': 1 },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        } else {
            // Player already exists: load the new video track immediately
            player.loadVideoById(videoId);
        }
    }

    // Listens to native YouTube video states (Ended, Playing, Paused)
    function onPlayerStateChange(event) {
        // YT.PlayerState.ENDED equals a status code of 0
        if (event.data === YT.PlayerState.ENDED) {
            playNextVideo();
        }
    }

    // Pulls the next indexed video item from your dynamic data track
    function playNextVideo() {
        if (currentVideoIndex + 1 < videoQueue.length) {
            playVideo(currentVideoIndex + 1);
        } else {
            console.log("Reached the end of current search results queue.");
        }
    }
</script>
</body>
</html>
